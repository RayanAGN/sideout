<title>Sideout</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm 760px column, a sticky top bar, fixed bottom tabs. Every screen starts from the player's own matches. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --soft:#edf1f6; --line:#dfe5ed; --ink:#0f1b2d; --muted:#5b6779;
  --brand:#14315c; --brand-ink:#ffffff; --accent:#2f6fde;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, var(--surface));
  --good:#1a7f43; --good-soft:color-mix(in srgb, var(--good) 13%, var(--surface));
  --warn:#b25d07; --warn-soft:color-mix(in srgb, var(--warn) 14%, var(--surface));
  --bad:#c52b2b; --bad-soft:color-mix(in srgb, var(--bad) 12%, var(--surface));
  --league:#2f6fde; --tourney:#c2410c;
  --display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c121b; --surface:#141c28; --soft:#1a2432; --line:#263244; --ink:#e7edf5; --muted:#9aa7b9;
  --brand:#0f2442; --good:#3fbf73; --warn:#e59a3a; --bad:#ef6464; --league:#6b9cf0; --tourney:#f08a4b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c121b; --surface:#141c28; --soft:#1a2432; --line:#263244; --ink:#e7edf5; --muted:#9aa7b9;
  --brand:#0f2442; --good:#3fbf73; --warn:#e59a3a; --bad:#ef6464; --league:#6b9cf0; --tourney:#f08a4b; color-scheme:dark }
body[data-skin="graphite"]{--brand:#2a2e35; --accent:#e07b39}
body[data-skin="plum"]{--brand:#47233f; --accent:#e07b39}
body[data-skin="sky"]{--brand:#0b5f8f; --accent:#0e98d6}
body[data-skin="teal"]{--brand:#0e5450; --accent:#13a394}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1} h2{font-size:22px} h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.logo svg{flex:none}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:inherit;display:grid;place-items:center;cursor:pointer}
.iconbtn .dot{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}

main{max-width:760px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.kind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.kind.league{color:var(--league)} .kind.tourney{color:var(--tourney)}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.sdot.good{background:var(--good)} .sdot.warn{background:var(--warn)} .sdot.bad{background:var(--bad)} .sdot.idle{background:var(--line)}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.steps li span{font-size:12px}
.steps li.done{color:var(--good);border-color:var(--good)} .steps li.now{color:var(--accent);border-color:var(--accent)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;flex:1}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Next match card: the product */
.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.next-top{color:inherit;font:inherit;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.when{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.vs .t{font-weight:700;font-size:16px;min-width:0}
.vs .t.me{color:var(--accent)}
.vs .mid{font-family:var(--display);font-size:15px;color:var(--muted)}
.vs .t:last-child{text-align:right}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.next-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--soft)}
.refnote{background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px;border-radius:8px;padding:7px 10px}

/* Match rows */
.list{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.mrow:first-child{border-top:0}
.mrow:hover{background:var(--soft)}
.mrow .tm{font-weight:700;font-size:14px}
.mrow .ct{font-size:12px;color:var(--muted)}
.mrow .teams{min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow .teams span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .me{color:var(--accent);font-weight:700}
.mrow .win{font-weight:700}
.mrow .score{text-align:right;font-size:13.5px;font-weight:600}
.dayh{font-family:var(--display);font-size:17px;font-weight:700;padding:10px 4px 4px;display:flex;align-items:center;gap:8px}

table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.tn{text-align:left;font-weight:600;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
tr.mine td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.mv{font-size:12px;font-weight:700;margin-left:4px}
.mv.up{color:var(--good)} .mv.dn{color:var(--bad)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=email],input[type=number],input[type=search],input[type=datetime-local],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ann{flex-direction:column;align-items:flex-start;gap:2px}
.banner.warn{background:var(--warn-soft)} .banner.good{background:var(--good-soft)} .banner.bad{background:var(--bad-soft)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}

.evcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%;font:inherit}
.evcard:hover{border-color:var(--muted)}
.cap{display:flex;align-items:center;gap:8px;font-size:13px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%}

/* Bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.bround{display:flex;flex-direction:column;justify-content:space-around;gap:12px;min-width:190px}
.bm{border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;cursor:pointer;text-align:left;padding:0;width:100%}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px}
.bm div+div{border-top:1px solid var(--line)}
.bm .w{font-weight:700}
.bm .tbd{color:var(--muted);font-style:italic}
.bm small{display:block;padding:4px 10px;color:var(--muted);font-size:11.5px;background:var(--soft);border-radius:10px 10px 0 0}

/* Live courts */
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.court{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.court.bad{border-color:var(--bad)}

/* Modal sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,14,24,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}
.setrow{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:44px;border:0;background:var(--soft);font-size:20px;font-weight:600;cursor:pointer}
.stepper input{border:0;border-radius:0;text-align:center;min-height:44px;padding:0;font-weight:700;font-size:18px;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.log{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.star{border:0;background:none;cursor:pointer;font-size:18px;color:var(--warn);padding:0 4px}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--bad);font-weight:700;font-size:12px;letter-spacing:.06em}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.live::before{animation:none}}
</style>

<script>
/* ============ Utilities ============ */
const DAY = 864e5, MIN = 6e4;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const midnight = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const at = (dayTs, hhmm) => { const [h,m] = hhmm.split(':').map(Number); const d = new Date(dayTs); d.setHours(h,m,0,0); return d.getTime(); };
const fTime = t => { const d = new Date(t); return d.getHours() + ':' + pad(d.getMinutes()); };
const fDay = t => { const d = new Date(t), today = midnight(Date.now()), dd = midnight(t);
  if (dd === today) return 'Today'; if (dd === today + DAY) return 'Tomorrow'; if (dd === today - DAY) return 'Yesterday';
  return WD[d.getDay()].slice(0,3) + ' ' + MO[d.getMonth()] + ' ' + d.getDate(); };
const fDate = t => { const d = new Date(t); return WD[d.getDay()].slice(0,3) + ' ' + MO[d.getMonth()] + ' ' + d.getDate(); };
const until = t => { const m = Math.round((t - Date.now()) / MIN); if (m < 0) return ''; if (m < 60) return 'in ' + m + ' min';
  const h = Math.floor(m / 60); if (h < 24) return 'in ' + h + ' h ' + pad(m % 60) + ' min'; return 'in ' + Math.round(h / 24) + ' days'; };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

/* ============ Match formats ============ */
const FMT = {
  bo3_25: { name: 'Best of 3 · sets to 25, 25, 15', bestOf: 3, to: [25,25,15] },
  bo3_21: { name: 'Best of 3 · sets to 21, 21, 15', bestOf: 3, to: [21,21,15] },
  two21:  { name: '2 sets to 21 (a 1–1 split counts)', fixed: 2, to: [21,21] },
  one25:  { name: '1 set to 25', fixed: 1, to: [25] },
};
function setOk(a, b, to){ const hi = Math.max(a,b), lo = Math.min(a,b); if (!Number.isInteger(a) || !Number.isInteger(b) || lo < 0) return false;
  if (hi < to) return false; if (hi - lo < 2) return false; if (hi > to && hi - lo !== 2) return false; return true; }
function validate(fk, sets){
  const f = FMT[fk]; if (!sets.length) return 'Enter at least one set.';
  let h = 0, a = 0;
  for (let i = 0; i < sets.length; i++){
    const [x,y] = sets[i], to = f.to[Math.min(i, f.to.length-1)];
    if (!setOk(x, y, to)) return `Set ${i+1}: first to ${to}, win by 2 (${x}–${y} isn't a finished set).`;
    if (f.bestOf && (h > f.bestOf/2 || a > f.bestOf/2)) return 'The match was already decided before set ' + (i+1) + '.';
    x > y ? h++ : a++;
  }
  if (f.bestOf && Math.max(h,a) < Math.ceil(f.bestOf/2)) return `Best of ${f.bestOf}: someone needs ${Math.ceil(f.bestOf/2)} sets.`;
  if (f.fixed && sets.length !== f.fixed) return `This format is exactly ${f.fixed} set${f.fixed>1?'s':''}.`;
  return null;
}
function res(m){ let hw=0, aw=0, hp=0, ap=0; (m.sets||[]).forEach(([x,y]) => { x > y ? hw++ : aw++; hp += x; ap += y; });
  return { hw, aw, hp, ap, winner: hw > aw ? m.home : aw > hw ? m.away : null }; }
const played = m => m.status === 'posted' || m.status === 'confirmed';

/* ============ Demo data ============ */
const FIRST = ['Alex','Sam','Jordan','Morgan','Camille','Olivier','Léa','Mathis','Chloé','Gabriel','Noémie','Félix','Sarah','Thomas','Emma','Nathan','Rosalie','Samuel','Laurence','William','Maya','Antoine','Zoé','Hugo','Jade','Louis','Clara','Raphaël','Alice','Émile','Juliette','Xavier','Florence','Victor','Élodie','Charles','Mia','Arnaud','Inès','Adam','Kim','Priya','Diego','Ana','Malik','Nina','Omar','Lina','Ravi','Sofia'];
const LAST = ['Tremblay','Nguyen','Lee','Roy','Gagnon','Côté','Bouchard','Gauthier','Morin','Lavoie','Fortin','Gagné','Ouellet','Pelletier','Bélanger','Lévesque','Bergeron','Leblanc','Paquette','Girard','Simard','Boucher','Caron','Beaulieu','Cloutier','Dubé','Poirier','Fournier','Lapointe','Leclerc','Lefebvre','Poulin','Thibault','St-Pierre','Nadeau','Martin','Landry','Martel','Bédard','Grenier','Lessard','Bernier','Richard','Michaud','Hébert','Desjardins','Couture','Turcotte','Lachance','Parent'];
const LEVELS = ['Recreational','Intermediate','Competitive'];

function seed(){
  const R = rng(11), pick = a => a[Math.floor(R() * a.length)];
  const S = { me:'u1', users:{}, teams:{}, events:[], matches:[], notes:[], ann:[], favs:{ u1:['u5','u6','u7'] }, v:5,
    orgs:[ { id:'o1', name:'Club Sideout Montréal', admins:['u1','u4'], tz:'America/Toronto', paypal:true },
           { id:'o2', name:'Volley Québec Plus', admins:['u90'], tz:'America/Toronto' },
           { id:'o3', name:'Ottawa Sand Series', admins:['u91'], tz:'America/Toronto' } ] };
  let n = 10;
  const user = (first, last, extra = {}) => { const id = extra.id || 'u' + (n++);
    S.users[id] = { id, first, last, name: first + ' ' + last, email: (first + '.' + last).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z.]/g,'') + '@example.com',
      gender: extra.gender || (R() < .5 ? 'W' : 'M'), level: extra.level || pick(LEVELS) }; return id; };
  user('Alex','Tremblay',{id:'u1',gender:'M',level:'Intermediate'});
  user('Sam','Nguyen',{id:'u2',gender:'W',level:'Intermediate'});

function ics(){ const ms = myMatches(); const z = t => { const d = new Date(t); return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z'; };
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sideout//EN', ...ms.flatMap(m => { const ev = evById(m.ev); return ['BEGIN:VEVENT','UID:' + m.id + '@sideout','DTSTART:' + z(m.start),'DTEND:' + z(m.start + 60*MIN),
    'SUMMARY:' + (myRole(m) === 'ref' ? 'Ref: ' : '') + (m.home ? tName(m.home) : slotLabel(S,m.hs)) + ' vs ' + (m.away ? tName(m.away) : slotLabel(S,m.as)) + ', ' + m.court, 'LOCATION:' + ev.venue + ', ' + ev.city, 'END:VEVENT']; }), 'END:VCALENDAR'].join('\r\n'); }
async function copy(text, msg){ try { await navigator.clipboard.writeText(text); toast(msg); } catch(e){ modal(`${head('Copy this')}<textarea readonly style="min-height:160px">${esc(text)}</textarea>`); $('#modal textarea').select(); } }
function notifyTeams(ids, text, go){ const seen = new Set(); ids.filter(Boolean).forEach(t => team(t).players.forEach(p => { if (!seen.has(p)){ seen.add(p); note(S, p, text, go); } })); }
function inviteNextFromWaitlist(ev, div){ div.invites = (div.invites || []).filter(v => v.until > Date.now());
  const open = div.max - div.teams.length - div.invites.length; const daysLeft = (ev.regEnd - Date.now()) / DAY; const window = daysLeft < 7 ? 1 : 3;
  for (let i = 0; i < open; i++){ const t = div.wait.find(w => !div.invites.some(v => v.t === w)); if (!t) break;
    div.invites.push({ t, until: Date.now() + window * DAY }); note(S, team(t).captain, `A spot opened in ${ev.name} · ${div.name}. Take it within ${window} day${window>1?'s':''} or it goes to the next team.`, '#ev-' + ev.id); } }

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('[data-act]')){ const id = g.dataset.id; if (g.dataset.tabto && id) ui.tab[id] = g.dataset.tabto; close(); go(g.dataset.go, id); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'closeScrim' && e.target !== a) return;
  const m = id ? S.matches.find(x => x.id === id) : null;
  switch (act){
    case 'close': case 'closeScrim': close(); break;
    case 'notes': notesModal(); render(); break;
    case 'openNote': { const n = S.notes.find(x => x.id === id); close(); if (n.go?.startsWith('#ev-')) go('ev', n.go.slice(4)); break; }
    case 'match': matchModal(id); break;
    case 'score': scoreModal(id); break;
    case 'quick': { const i = +a.dataset.i, side = +a.dataset.side, f = FMT[S.matches.find(x => x.id === ui.draft.id).fmt], to = f.to[Math.min(i, f.to.length-1)];
      readDraft(); const s = ui.draft.sets[i]; s[side] = to; const o = Number(s[1-side]); if (s[1-side] === '' || o > to - 2) s[1-side] = to - 2 - (o > to - 2 || s[1-side] === '' ? 5 : 0); drawScore(); $('#s' + i + (1-side))?.focus(); $('#s' + i + (1-side))?.select(); break; }
    case 'step': { readDraft(); const s = ui.draft.sets[+a.dataset.i], k = +a.dataset.k; s[k] = Math.max(0, (Number(s[k]) || 0) + Number(a.dataset.v)); drawScore(); break; }
    case 'submitScore': { readDraft(); const d = ui.draft, mm = S.matches.find(x => x.id === d.id);
      const sets = d.sets.filter(s => s[0] !== '' || s[1] !== '').map(s => [Number(s[0]), Number(s[1])]);
      const err = validate(mm.fmt, sets); if (err){ const el = $('#scoreErr'); el.textContent = err; el.hidden = false; break; }
      const was = played(mm), myT = onTeam(mm.home) ? mm.home : onTeam(mm.away) ? mm.away : null;
      mm.sets = sets; mm.status = 'posted'; mm.postedAt = Date.now(); mm.postedBy = S.me; mm.postedTeam = myT; mm.live = null; mm.disputed = null;
      mm.log.push({ at: Date.now(), who: S.me, what: (was ? 'changed the score to ' : 'entered ') + setsText(sets) + (myT ? '' : onTeam(mm.ref) ? ' (referee)' : ' (organizer)') });
      if (!myT){ mm.status = 'confirmed'; }
      const other = myT === mm.home ? mm.away : myT === mm.away ? mm.home : null;
      if (other) note(S, team(other).captain, `${tName(myT)} entered ${setsText(sets)} vs ${tName(other)}. Confirm or dispute within 24 hours.`, '#home');
      close(); toast('Score saved'); render(); break; }
    case 'forfeit': { const mm = S.matches.find(x => x.id === ui.draft.id), myT = onTeam(mm.home) ? mm.home : mm.away, f = FMT[mm.fmt];
      const win = myT === mm.home ? 'away' : 'home', n = f.fixed || Math.ceil(f.bestOf/2);
      mm.sets = Array.from({length:n}, (_, i) => win === 'home' ? [f.to[i], 0] : [0, f.to[i]]); mm.status = 'confirmed'; mm.log.push({ at: Date.now(), who: S.me, what: 'reported a forfeit by ' + tName(myT) });
      notifyTeams([mm.home === myT ? mm.away : mm.home], `${tName(myT)} forfeited your match. You win by default.`, '#home'); close(); toast('Forfeit recorded.'); render(); break; }
    case 'confirm': m.status = 'confirmed'; m.log.push({ at: Date.now(), who: S.me, what: 'confirmed' }); note(S, m.postedBy, `${me().name} confirmed ${setsText(m.sets)}.`, '#home'); close(); toast('Score confirmed.'); render(); break;
    case 'dispute': { modal(`${head('Dispute score')}<span class="muted small">${esc(tName(m.home))} ${setsText(m.sets)} ${esc(tName(m.away))}</span><div class="field"><label for="dp">What's wrong?</label><textarea id="dp" placeholder="Set 2 was 25–23 for us"></textarea></div><button class="btn primary" data-act="doDispute" data-id="${m.id}">Send to the organizer</button>`); break; }
    case 'doDispute': { const why = $('#dp').value.trim() || 'Score is wrong'; m.disputed = why; m.log.push({ at: Date.now(), who: S.me, what: 'disputed: ' + why });
      S.orgs.find(o => o.id === evById(m.ev).org).admins.forEach(u => note(S, u, `Score disputed: ${tName(m.home)} vs ${tName(m.away)}. “${why}”`, '#organize')); close(); toast('Sent to organizer'); render(); break; }
    case 'evtab': ui.tab[ui.id] = a.dataset.v; render(); break;
    case 'mine': ui.mine[ui.id] = a.dataset.v === '1'; render(); break;
    case 'bracket': ui.bracket = a.dataset.v; render(); break;
    case 'tiebreak': {
      modal(`${head('How ties are broken')}<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li><b>Matches won</b></li><li><b>Set ratio</b> (won ÷ lost)</li><li><b>Point ratio</b> (won ÷ lost)</li><li><b>Head to head</b></li><li>Coin toss</li></ol>`); break; }
    case 'cal': calModal(); break;
    case 'copyFeed': copy('webcal://sideout.app/cal/' + S.me + '.ics', 'Calendar link copied.'); break;
    case 'copyIcs': copy(ics(), 'Calendar file copied.'); break;
    case 'invite': copy('https://sideout.app/join/' + a.dataset.t, 'Invite link copied'); break;
    case 'shareReg': copy(location.href.split('#')[0] + '#reg-' + a.dataset.ev, 'Registration link copied'); break;
    case 'favEv': { S.favEvents = S.favEvents || []; S.favEvents = S.favEvents.includes(id) ? S.favEvents.filter(x => x !== id) : [...S.favEvents, id]; render(); break; }
    case 'register': ui.reg = null; registerModal(a.dataset.ev); break;
    case 'editTeam': ui.reg = null; registerModal(team(a.dataset.t).ev, a.dataset.t); break;
    case 'rdiv': ui.reg.div = a.value; ui.reg.name = $('#rg-name').value; registerModal(ui.reg.ev, ui.reg.edit); break;
    case 'rmP': ui.reg.players = ui.reg.players.filter(p => p !== a.dataset.v); ui.reg.name = $('#rg-name').value; registerModal(ui.reg.ev, ui.reg.edit); break;
    case 'addFav': ui.reg.players.push(a.dataset.v); ui.reg.name = $('#rg-name').value; registerModal(ui.reg.ev, ui.reg.edit); break;
    case 'addEmail': { const em = $('#rg-email').value.trim().toLowerCase(); ui.reg.name = $('#rg-name').value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ const el = $('#regErr'); el.textContent = 'Enter a full email address. Email is how Sideout knows each player.'; el.hidden = false; break; }
      let u = Object.values(S.users).find(x => x.email === em);
      if (!u){ const nm = em.split('@')[0].split(/[._-]/); const idu = 'u' + uid(); S.users[idu] = { id: idu, first: cap(nm[0]), last: cap(nm[1] || ''), name: cap(nm[0]) + ' ' + cap(nm[1] || ''), email: em, gender: '', level: 'Intermediate', invited: true }; u = S.users[idu]; }
      if (!ui.reg.players.includes(u.id)) ui.reg.players.push(u.id); registerModal(ui.reg.ev, ui.reg.edit); break; }
    case 'surnames': { const ls = ui.reg.players.map(p => S.users[p].last).filter(Boolean); ui.reg.name = ls.length ? ls.slice(0, 3).join(' / ') : ''; registerModal(ui.reg.ev, ui.reg.edit); break; }
    case 'submitReg': { const R = ui.reg, ev = evById(R.ev), div = ev.divs.find(d => d.id === R.div); R.name = $('#rg-name').value.trim();
      const err = !R.name ? 'Give your team a name, or tap "Use surnames".' : R.players.length < div.min ? `${div.name} needs at least ${div.min} players. Add ${div.min - R.players.length} more by email.` : null;
      if (err){ const el = $('#regErr'); el.textContent = err; el.hidden = false; break; }
      if (R.edit){ const t = team(R.edit); t.name = R.name; t.players = R.players.slice(); close(); toast('Roster saved.'); render(); break; }
      const full = div.teams.length >= div.max;
      const tid = 't' + uid(); S.teams[tid] = { id: tid, name: R.name, ev: ev.id, div: div.id, captain: S.me, players: R.players.slice(), strength: .5, paid: false, method: ev.online ? 'PayPal' : 'Interac', note: '', at: Date.now() };
      (full ? div.wait : div.teams).push(tid);
      R.players.filter(p => p !== S.me).forEach(p => note(S, p, `${me().name} added you to ${R.name} for ${ev.name}.`, '#ev-' + ev.id));
      S.favs[S.me] = [...new Set([...(S.favs[S.me] || []), ...R.players.filter(p => p !== S.me)])];
      close(); ui.tab[ev.id] = 'divisions';
      if (full) toast(`Full · you're #${div.wait.length} on the waiting list`);
      else if (ev.online) { S.teams[tid].paid = true; toast('Registered and paid'); }
      else toast('Registered · pay at the door');
      go('ev', ev.id); break; }
    case 'paypal': team(a.dataset.t).paid = true; team(a.dataset.t).method = 'PayPal'; toast('Paid by PayPal. Your team is active.'); render(); break;
    case 'takeSpot': { const ev = evById(a.dataset.ev), div = ev.divs.find(d => d.id === a.dataset.div), t = a.dataset.t;
      div.wait = div.wait.filter(x => x !== t); div.invites = div.invites.filter(v => v.t !== t); div.teams.push(t); toast(`${tName(t)} is in ${div.name}.`); render(); break; }
    case 'as': S.me = a.dataset.v; toast('Now viewing as ' + me().name); go('home'); break;
    case 'skin': S.skin = a.dataset.v; render(); break;
    case 'reset': S = seed(); ui.tab = {}; ui.mine = {}; toast('Demo data reset.'); go('home'); break;
    // organizer
    case 'orgtab': ui.orgTab = a.dataset.v; render(); break;
    case 'toggleReg': { const ev = evById(ui.orgEv); ev.regOpen = !ev.regOpen; if (!ev.regOpen) ev.regEnd = Date.now(); else ev.regEnd = Math.max(ev.regEnd, Date.now() + 7*DAY); render(); break; }
    case 'max': { const ev = evById(ui.orgEv), d = ev.divs.find(x => x.id === a.dataset.d); d.max = Math.max(d.teams.length > d.max ? d.max : 2, d.max + Number(a.dataset.v)); if (+a.dataset.v > 0) inviteNextFromWaitlist(ev, d); render(); break; }
    case 'paid': { const t = team(a.dataset.t); t.paid = !t.paid; render(); break; }
    case 'withdraw': { const ev = evById(ui.orgEv), d = ev.divs.find(x => x.id === a.dataset.d); d.teams = d.teams.filter(x => x !== a.dataset.t); note(S, team(a.dataset.t).captain, `${tName(a.dataset.t)} was removed from ${ev.name}.`, ''); inviteNextFromWaitlist(ev, d); toast('Removed · next team invited'); render(); break; }
    case 'promote': { const ev = evById(ui.orgEv), d = ev.divs.find(x => x.id === a.dataset.d); d.wait = d.wait.filter(x => x !== a.dataset.t); d.invites = (d.invites||[]).filter(v => v.t !== a.dataset.t); d.teams.push(a.dataset.t); if (d.teams.length > d.max) d.max = d.teams.length; note(S, team(a.dataset.t).captain, `${tName(a.dataset.t)} is in ${ev.name} · ${d.name}.`, '#ev-' + ev.id); render(); break; }
    case 'emails': { const ev = evById(ui.orgEv); const em = [...new Set(ev.divs.flatMap(d => d.teams.flatMap(t => team(t).players.map(p => S.users[p].email))))]; copy(em.join(', '), em.length + ' emails copied.'); break; }
    case 'buildT': { const ev = evById(ui.orgEv), d = ev.divs.find(x => x.id === a.dataset.d); buildTournament(S, ev, d); ev.published = true; notifyTeams(d.teams, `${ev.name}: pools are out. See when and where you play.`, '#ev-' + ev.id); toast('Pools published'); render(); break; }
    case 'move': moveModal(id); break;
    case 'doMove': { const t = new Date($('#mv-t').value).getTime(), c = $('#mv-c').value; if (!t){ break; }
      const clash = S.matches.find(x => x.id !== m.id && x.court === c && Math.abs(x.start - t) < 50*MIN && x.ev === m.ev);
      const busy = S.matches.find(x => x.id !== m.id && Math.abs(x.start - t) < 50*MIN && [x.home, x.away, x.ref].some(z => z && [m.home, m.away].includes(z)));
      if ((clash || busy) && !a.dataset.force){ const el = $('#mvErr'); el.innerHTML = (clash ? `${esc(c)} already has ${esc(tName(clash.home))} vs ${esc(tName(clash.away))} at ${fTime(clash.start)}. ` : '') + (busy ? `A team is already playing or refereeing at ${fTime(busy.start)}. ` : '') + `<button class="btn sm" data-act="doMove" data-id="${m.id}" data-force="1">Move anyway</button>`; el.hidden = false; break; }
      const was = `${fDay(m.start)} ${fTime(m.start)}, ${m.court}`; m.start = t; m.court = c; m.log.push({ at: Date.now(), who: S.me, what: `moved the match from ${was}` });
      notifyTeams([m.home, m.away, m.ref], `Schedule modified: ${tName(m.home)} vs ${tName(m.away)} moved from ${was} to ${fDay(t)} ${fTime(t)}, ${c}.`, '#ev-' + m.ev);
      close(); toast('Moved · teams notified'); render(); break; }
    case 'announce': { const txt = $('#ann').value.trim(); if (!txt) break; const ev = evById(ui.orgEv); S.ann.push({ ev: ev.id, at: Date.now(), text: txt });
      notifyTeams(ev.divs.flatMap(d => d.teams), `${ev.name}: ${txt}`, '#ev-' + ev.id); toast('Sent to every player.'); render(); break; }
    case 'newEv': { const day = midnight(Date.now()) + 30*DAY, eid = 't' + uid(), org = myOrgs()[0].id;
      S.events.push({ id: eid, kind:'tournament', org, season:'2026–27', name:'New tournament', date: day, start: at(day, '09:00'), slot:30, days:1, venue:'', city:'Montréal', courts:['Court 1','Court 2','Court 3','Court 4'], published:false, listed:false, regOpen:false, regEnd: day - 3*DAY, online:true,
        divs:[{ id: eid + 'd' + uid(), name:'Coed 4s', level:'Intermediate', gender:'Coed', fmt:'two21', bfmt:'bo3_21', max:16, price:160, min:4, teams:[], wait:[], invites:[], pools:[] }] });
      ui.orgEv = eid; ui.orgTab = 'setup'; render(); const el = $('#ef-name'); el.focus(); el.select(); break; }
    case 'addDiv': { const ev = evById(ui.orgEv); ev.divs.push({ id: ev.id + 'd' + uid(), name:'Division ' + (ev.divs.length + 1), level:'Intermediate', gender:'Coed', fmt:'two21', bfmt:'bo3_21', max:12, price: ev.divs[0]?.price || 0, min:4, teams:[], wait:[], invites:[], pools:[] }); render(); break; }
    case 'rmDiv': { const ev = evById(ui.orgEv); ev.divs = ev.divs.filter(d => d.id !== a.dataset.d); render(); break; }
    case 'rmEv': { S.events = S.events.filter(e => e.id !== ui.orgEv); ui.orgEv = null; toast('Draft deleted'); render(); break; }
    case 'openReg': { const ev = evById(ui.orgEv);
      if (!ev.venue.trim() || !ev.divs.length){ ui.orgTab = 'setup'; render(); toast(!ev.divs.length ? 'Add a division first' : 'Add a venue first'); break; }
      ev.listed = true; ev.regOpen = true; if (ev.regEnd < Date.now()) ev.regEnd = ev.start - DAY; ui.orgTab = 'teams'; toast('Published. Registration is open.'); render(); break; }
    case 'drawAll': { const ev = evById(ui.orgEv), ds = ev.divs.filter(d => d.teams.length >= 3);
      if (!ds.length){ toast('A division needs at least 3 teams'); break; }
      ds.forEach(d => { buildTournament(S, ev, d); notifyTeams(d.teams, `${ev.name}: pools are out.`, '#ev-' + ev.id); }); ev.published = true; ui.orgTab = 'schedule'; toast('Pools published'); render(); break; }
  }
});
function readDraft(){ if (!ui.draft) return; ui.draft.sets.forEach((s, i) => [0,1].forEach(k => { const el = $('#s' + i + k); if (el) s[k] = el.value === '' ? '' : Number(el.value); })); }
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lq'){ ui.lq = t.value; const pos = t.selectionStart; render(); const el = $('#lq'); el.focus(); el.setSelectionRange(pos, pos); }
  if (t.dataset.disc){ ui.disc[t.dataset.disc] = t.value; if (t.tagName === 'INPUT'){ const pos = t.selectionStart, id = t.id; render(); const el = $('#' + id); el.focus(); el.setSelectionRange(pos, pos); } else render(); }
  if (t.dataset.note){ team(t.dataset.note).note = t.value; save(); }
  if (t.dataset.evf || t.dataset.divf){ setField(t); save(); }
});
document.addEventListener('change', e => { if (e.target.id === 'org-ev'){ ui.orgEv = e.target.value; render(); } if (e.target.dataset.evf || e.target.dataset.divf){ setField(e.target); save(); } });
function setField(t){
  const ev = evById(ui.orgEv); if (!ev) return;
  if (t.dataset.evf){ const f = t.dataset.evf, v = t.value;
    if (f === 'name' || f === 'venue' || f === 'city') ev[f] = v;
    if (f === 'date' && v){ const [y, mo, d] = v.split('-').map(Number), nd = new Date(y, mo-1, d).getTime(); ev.start = at(nd, fTime(ev.start).padStart(5,'0')); ev.date = nd; }
    if (f === 'time' && /^\d{1,2}:\d{2}$/.test(v)){ ev.start = at(ev.date, v); }
    if (f === 'days') ev.days = Math.max(1, +v || 1);
    if (f === 'courts'){ const n = Math.min(20, Math.max(1, +v || 1)); ev.courts = Array.from({length:n}, (_, i) => 'Court ' + (i+1)); }
    if (f === 'regEnd' && v){ const [y, mo, d] = v.split('-').map(Number); ev.regEnd = new Date(y, mo-1, d, 23, 59).getTime(); }
    if (f === 'online') ev.online = v === '1';
  } else { const [id, f] = t.dataset.divf.split(':'), d = ev.divs.find(x => x.id === id); if (!d) return;
    d[f] = ['max','price','min'].includes(f) ? Math.max(f === 'price' ? 0 : 1, +t.value || 0) : t.value; }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) close(); if (e.key === 'Enter' && e.target.id === 'rg-email'){ e.preventDefault(); $('[data-act=addEmail]').click(); } });
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render();
setInterval(() => { if (!$('#modal').innerHTML && !document.activeElement?.matches('input,textarea,select')) render(); }, 60000);
</script>
